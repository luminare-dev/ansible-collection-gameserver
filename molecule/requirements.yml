# Collections the Molecule docker driver needs on the controller (container management and the
# rsync of the build context). They are test tools, not dependencies of luminare.gameserver.
# Exact versions; ansible-galaxy checks each download against the sha256 that Galaxy publishes.
# Dependabot does not read this file: review the versions with the monthly tool bump.
collections:
  - name: community.docker
    version: "5.3.0"
  - name: ansible.posix
    version: "2.2.2"
