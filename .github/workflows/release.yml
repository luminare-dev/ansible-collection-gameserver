# Caller: release-please on every push to main (skipped in the template repository).
# Each release gets the source archive, the collection tarball and one SHA256SUMS; nothing goes to Galaxy.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.repository.is_template }}
    uses: ./.github/workflows/reusable-release.yml
    with:
      # Installs the hash-pinned tools into $RUNNER_TEMP/test-tools/venv, then ansible-lint and
      # the unit tests (scripts/test.sh).
      test-command: bash scripts/test.sh
      # Uses ansible-galaxy from that virtual environment. The file name check fails the release
      # when galaxy.yml's version (updated by release-please) does not match the tag. Then the
      # tarball is installed into an empty folder and its playbook and roles must pass
      # --syntax-check (scripts/check_collection_tarball.sh), before the publish job runs.
      extra-dist-command: >-
        export PATH="$RUNNER_TEMP/test-tools/venv/bin:$PATH"
        && ansible-galaxy collection build --output-path dist
        && test -f "dist/luminare-gameserver-${TAG#v}.tar.gz"
        && bash scripts/check_collection_tarball.sh "dist/luminare-gameserver-${TAG#v}.tar.gz"
    permissions:
      contents: write        # release commit, tag, draft release, attached files
      pull-requests: write   # the release pull request
      issues: write          # release-please labels
      id-token: write        # Sigstore certificate for the attestation
      attestations: write    # store the attestation
