# Dependabot: action SHA pins, the hash-pinned Python tools and the base image digests (7-day cooldown).
# gitleaks, actionlint and molecule/requirements.yml are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      dev-tools:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /molecule/resources
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: test
      include: scope
    labels: [dependencies]
    ignore:
      # Keep the tags (ubuntu:24.04 would otherwise become 25.10, 26.04, ...); digests still update.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      molecule-images:
        patterns: ["*"]
