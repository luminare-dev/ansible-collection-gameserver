# Molecule base configuration, shared by every role scenario of this collection. Molecule finds it
# at the repository root and merges each roles/<role>/molecule/<scenario>/molecule.yml on top of
# it (lists such as "platforms" are replaced, not merged, so every scenario lists its platforms).
#
# A scenario declares two platforms built from molecule/resources/Dockerfile.j2:
#   platforms:
#     - name: gs-<role>-debian13        # "gs-" prefix keeps names unique on a shared Docker daemon;
#                                       # write "_" in a role name as "-" (it is also the host name)
#       image: gs-debian13              # or gs-ubuntu2404; selects the digest-pinned base image
#       dockerfile: ../../../../molecule/resources/Dockerfile.j2
#       privileged: true
#       cgroupns_mode: host
#       volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
#       tmpfs: ["/run", "/run/lock"]
#       command: /lib/systemd/systemd
#
# Run one scenario:  cd roles/<role> && molecule test
# One platform only, as each CI job does:  molecule test --platform-name gs-<role>-debian13

# Roles are used from this checkout (ansible.cfg roles_path below), not installed as stand-alone
# Galaxy roles, so Molecule's role-mode "prerun" install is turned off.
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../molecule/requirements.yml

driver:
  name: docker

ansible:
  cfg:
    defaults:
      # Sibling roles of this collection (for example a role that notifies another role's handler)
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
  env:
    ANSIBLE_FORCE_COLOR: "0"

provisioner:
  name: ansible

verifier:
  name: ansible

scenario:
  # dependency, syntax, create, prepare, converge, idempotence (must report changed=0), verify,
  # destroy; plus a destroy first, so that a run aborted earlier cannot leave a stale container
  # behind. Tasks that cannot run in a container are tagged molecule-notest (Molecule skips them).
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
