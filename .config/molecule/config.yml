# Molecule base configuration shared by every scenario; each scenario's molecule.yml is merged on top
# and lists its own platforms (gs-<role>[-<scenario>]-debian13 / -ubuntu2404, from molecule/resources/Dockerfile.j2).
# Run one scenario: cd roles/<role> && molecule test [--scenario-name <scenario>] [--platform-name <instance>]

# Roles are used from this checkout (ansible.cfg roles_path below), not installed as stand-alone
# Galaxy roles, so Molecule's role-mode "prerun" install is turned off.
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../molecule/requirements.yml

driver:
  name: docker

ansible:
  cfg:
    defaults:
      # Sibling roles of this collection (for example a role that notifies another role's handler)
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
  env:
    ANSIBLE_FORCE_COLOR: "0"

provisioner:
  name: ansible

verifier:
  name: ansible

scenario:
  # dependency, syntax, create, prepare, converge, idempotence (must report changed=0), verify,
  # destroy; plus a destroy first, so that a run aborted earlier cannot leave a stale container
  # behind. Tasks that cannot run in a container are tagged molecule-notest (Molecule skips them).
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
