# Scenario "playbook": runs playbooks/gameserver.yml with the example inventory (placeholders and
# the build replaced by test values), the e2e host checks, and the refusals of the unchanged example.
# It lives here because txadmin is the last role of the playbook.
platforms:
  - name: gs-txadmin-playbook-debian13
    image: gs-debian13
    dockerfile: ../../../../molecule/resources/Dockerfile.j2
    groups:
      - gameservers
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
  - name: gs-txadmin-playbook-ubuntu2404
    image: gs-ubuntu2404
    dockerfile: ../../../../molecule/resources/Dockerfile.j2
    groups:
      - gameservers
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../../../../examples/inventory/group_vars/
