- name: Converge
  hosts: all
  vars:
    fxserver_build: 35245
    fxserver_artifact_url: file:///opt/fake/35245/fx.tar.xz
    fxserver_artifact_sha256: "{{ txadmin_test_fake_artifact.stat.checksum }}"
  pre_tasks:
    - name: Read the sha256 of the fake artifact (built in prepare.yml)
      ansible.builtin.stat:
        path: /opt/fake/35245/fx.tar.xz
        checksum_algorithm: sha256
      register: txadmin_test_fake_artifact
  # The order a playbook needs: the fxserver role installs the build and the unit that runs
  # txAdmin (fxserver_mode: txadmin, set in molecule.yml), then this role configures txAdmin.
  roles:
    - role: fxserver
    - role: txadmin
