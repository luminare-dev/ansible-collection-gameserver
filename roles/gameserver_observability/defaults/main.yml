# Defaults of luminare.gameserver.gameserver_observability. Every variable is described in
# meta/argument_specs.yml and in the role README; secrets belong in an encrypted variables file,
# never here. The role runs on the host of an existing Prometheus: the game server host itself
# (targets on 127.0.0.1) or a monitoring host that reaches the game servers over a private network.

# Game servers to watch: the value of the server label, the address Prometheus reaches the game
# port on (host name, IPv4 or IPv6 address) and the game port.
gameserver_observability_targets:
  - server: game-01
    address: 127.0.0.1
    port: 30120

# /perf/ basic auth: the same user and password as sv_prometheusBasicAuthUser and
# sv_prometheusBasicAuthPassword on every game server in the targets (fxserver_perf_user and
# fxserver_perf_password of the fxserver role, or the txadmin role's toggle).
gameserver_observability_perf_user: prometheus
gameserver_observability_perf_password: ""

# Optional jobs of the pack: probes of admin hostnames behind an access-protected tunnel
# (fxserver_tunnel) and the platform's public version list (fxserver_versions, outbound HTTPS).
gameserver_observability_admin_probes: []
gameserver_observability_versions_job: false

# json_exporter and blackbox_exporter, installed from their official release archives with a
# pinned sha256, as services with their own names, on loopback or a private address.
gameserver_observability_listen_address: 127.0.0.1
gameserver_observability_json_exporter_port: 7979
gameserver_observability_json_exporter_version: "0.8.0"
gameserver_observability_json_exporter_sha256: bd25fe58f62cec131b2ecbe859358990bb07f0266439ddcdef501fdd182a4fe1
gameserver_observability_blackbox_exporter_port: 9115
gameserver_observability_blackbox_exporter_version: "0.29.0"
gameserver_observability_blackbox_exporter_sha256: 5512929259bb6164f68ebe20ce433ec43b8609e3a79c95324f5020e931488fb4

# The existing Prometheus: where the role puts its files (scrape_configs/, rules/, secrets/ below
# the config directory), how it reloads Prometheus and where it checks that the jobs and rules
# are loaded ("" skips that check).
gameserver_observability_prometheus_config_dir: /etc/prometheus
gameserver_observability_prometheus_config_file: "{{ gameserver_observability_prometheus_config_dir }}/prometheus.yml"
gameserver_observability_prometheus_group: prometheus
gameserver_observability_prometheus_service: prometheus.service
gameserver_observability_prometheus_reload: true
gameserver_observability_prometheus_url: http://127.0.0.1:9090
gameserver_observability_promtool: promtool
gameserver_observability_rule_files:
  - fxserver.recording.yml
  - fxserver.alerts.yml
  - build.alerts.yml
  - host.alerts.yml
  - mariadb.alerts.yml

# The dashboard "Game server overview" for an existing Grafana (provisioning files only).
gameserver_observability_grafana_dashboards: false
gameserver_observability_grafana_provisioning_dir: /etc/grafana/provisioning
gameserver_observability_grafana_dashboards_dir: /var/lib/grafana/dashboards/gameserver-observability
gameserver_observability_grafana_service: grafana-server.service

# Firewall drop-in /etc/nftables.d/50-observability.nft (luminare.infra_edge base role layout):
# the exporter ports for these sources, only with a private listen address.
gameserver_observability_firewall_manage: false
gameserver_observability_firewall_reload: true
gameserver_observability_firewall_sources: []
