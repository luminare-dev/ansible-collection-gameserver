- name: Install the backup script fxserver-backup
  ansible.builtin.template:
    src: fxserver-backup.sh.j2
    dest: "{{ __fxserver_backup_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Install the backup service and timer units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - fxserver-backup.service
    - fxserver-backup.timer
  register: __fxserver_backup_units

- name: Enable and start, or disable and stop, the backup timer
  ansible.builtin.systemd_service:
    name: fxserver-backup.timer
    enabled: "{{ fxserver_backup_timer_enabled | bool }}"
    state: "{{ 'started' if fxserver_backup_timer_enabled | bool else 'stopped' }}"
    daemon_reload: "{{ __fxserver_backup_units is changed }}"
