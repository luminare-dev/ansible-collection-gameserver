- name: Install the systemd unit fxserver.service
  ansible.builtin.template:
    src: fxserver.service.j2
    dest: "{{ __fxserver_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  register: __fxserver_unit
  notify: Restart fxserver

- name: Enable or disable the service at boot (it is started after the build switch)
  ansible.builtin.systemd_service:
    name: fxserver.service
    enabled: "{{ fxserver_service_enabled | bool }}"
    daemon_reload: "{{ __fxserver_unit is changed }}"
