- name: Restart fxserver
  ansible.builtin.systemd_service:
    name: fxserver.service
    state: restarted
    daemon_reload: true
  when: fxserver_service_state == 'started'
  listen: restart fxserver

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

# Loads /etc/nftables.conf with the new drop-in. Molecule sets fxserver_firewall_reload: false,
# because a container is no place to prove a loaded ruleset (the drop-in is still validated).
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    state: restarted
  when: fxserver_firewall_reload | bool
