# Secrets of the example game server: placeholders only. Replace every CHANGE_ME_ value and
# encrypt this file before it holds a real value, for example with "ansible-vault encrypt" or
# SOPS; never commit it unencrypted. The roles refuse these placeholders, so the playbook stops
# before its first change until they are replaced.
fxserver_license_key: CHANGE_ME_LICENSE_KEY
# 16-48 letters, digits, "_" or "-"; send it in the x-txadmin-envtoken header.
txadmin_api_token: CHANGE_ME_API_TOKEN
# bcrypt hash of the master account's password (see roles/txadmin/README.md).
txadmin_default_account_password_hash: CHANGE_ME_BCRYPT_HASH
# Observability toggle: basic auth for /perf/ on the game port (password: 24 characters or more).
txadmin_prometheus_basic_auth:
  enabled: true
  user: prometheus
  password: CHANGE_ME_AT_LEAST_24_CHARACTERS
