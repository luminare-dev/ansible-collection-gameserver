# Example inventory for the playbook luminare.gameserver.gameserver: one host in the group
# "gameservers". Copy this folder, replace the host name and address (documentation values here),
# replace the placeholders in group_vars/gameservers/secrets.yml and encrypt that file.
gameservers:
  hosts:
    play.example.com:
      ansible_host: 192.0.2.10
      # A user with sudo rights; the playbook uses become.
      ansible_user: admin
